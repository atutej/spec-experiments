data:
  shuffle: true
  kind: parquet
trainer:
  training_metrics: true
  policy_train_spans: true
  rollout_spans: true
  strategy: megatron
  policy:
    optimizer_config:
      optimizer: AdamW
      lr: 1.0e-06
      adam_betas:
      - 0.9
      - 0.999
      weight_decay: 0.0
      max_grad_norm: 0.5
      num_warmup_steps: 0
      scheduler: constant_with_warmup
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
  ref:
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
  algorithm:
    advantage_estimator: rloo_n
    group_advantage_min_size: 2
    kl_estimator_type: k3_unbiased_gradient
    use_kl_loss: false
    use_entropy_loss: false
    advantage_batch_normalize: false
    policy_loss_type: regular
    loss_reduction: token_mean
    rloo_n_filter_zero_reward_groups: false
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    off_policy_correction: tis
  rollout_buffer:
    max_staleness_steps: 2
    batch_policy: full_batch
    max_in_flight: 128
    object_store_root: null
  gradient_checkpointing: true
  resume_mode: none
  callbacks: []
  ckpt_interval: 0
  hf_save_interval: -1
  epochs: 50
  max_steps: 10
  update_epochs_per_batch: 1
  micro_forward_batch_size_per_gpu: 1
  use_sample_packing: false
  offload_optimizer_during_rollouts: false
  eval_batch_size: 256
  eval_before_train: false
  eval_interval: -1
  flash_attn: false
  project_name: marin-snowball-rl
  logger:
  - console
  - records
  - wandb
  tracker_commit_each_step: true
  placement:
    colocate_all: false
    colocate_policy_ref: true
    policy_num_nodes: 8
    policy_num_gpus_per_node: 4
    ref_num_nodes: 8
    ref_num_gpus_per_node: 4
  train_batch_size: 128
  policy_mini_batch_size: 128
  micro_train_batch_size_per_gpu: 1
generator:
  run_engines_locally: true
  backend: vllm
  vllm_attention_backend: FLASH_ATTN
  weight_sync_backend: nccl
  weight_sync_pause:
    mode: keep
    clear_cache: true
  weight_sync_transport: expert_block
  expert_block_sync:
    timeout_seconds: 600
    verify: false
  enable_prefix_caching: true
  enable_chunked_prefill: true
  max_num_batched_tokens: 8192
  enforce_eager: false
  gpu_memory_utilization: 0.75
  max_num_seqs: 1024
  chat_template: null
  engine_init_kwargs:
    moe_backend: triton
    enable_auto_tools: true
    tool_parser: hermes
  speculative_decoding:
    method: dspark
    model:
      source_uri: hf://atutej/dspark_grug-67b-a2b-datakit-sft-dr-doom_datakit-sft-mix_targetgen-warm80k-20261020
      source_identity: d22f4f21ce5cc0968dfd8e2c0d06aaf4adacbbf2
    num_speculative_tokens: 4
  sampling_params:
    ignore_eos: true
    temperature: 1.0
    top_p: 1.0
    logprobs: 0
  trajectory_reward_shaping:
    enabled: true
    overlong:
      penalty_scale: 0.0
    reasoning_span:
      penalty: 0.1
      target: marker
  apply_overlong_filtering: false
  num_inference_engines: 1
  inference_engine_tensor_parallel_size: 1
  inference_engine_pipeline_parallel_size: 1
  inference_engine_data_parallel_size: 8
  inference_engine_expert_parallel_size: 8
  n_samples_per_prompt: 4
environment:
  task_sessions:
    local: {}
trajectory_runner:
  max_concurrent_tasks: 1024
context_budget:
  request_window_tokens: 24576
  max_new_tokens_per_turn: 4096
  max_turns: 1
extra_env:
  NCCL_IB_HCA: ibp
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
entrypoint: standard

