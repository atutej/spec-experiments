# Aurora (external mode) config: DSpark drafter for Snowball (the DR. DOOM target), ONLINE on the RLVR TRAIN prompts, warm-started from the Dr. Doom itw 80k drafter (INIT_DRAFT=runs/eval_ckpts/drdoom_itw_step80813).
# Same settings as the Datakit warm-start run (../aurora_grug-67b-a2b-dr-doom_datakit-sft-mix_dspark-online/config.yaml: lr 1e-5, 32 samples per optimizer step, Aurora's forward KL, confidence head frozen)
# except what long RL rollouts need: completions up to 4,096 new tokens, trainer / Mooncake sequence length 8,320, a larger Mooncake buffer. Used with run.sh of ../aurora_grug-67b-a2b-dr-doom_datakit-sft-mix_eagle3-online (see run_long_itw80k.sbatch).
model:
  target_model_path: open-athena/Grug-67B-A2B-Datakit-SFT-262K-2026.09.21-dr-doom
  trust_remote_code: true
  draft_model_config: null        # run.sh

dataset:
  train_data_path: ""             # run.sh: one Datakit shard (.arrow); only the vocabulary mapping and loading use it, the trainer never trains on its rows
  pretokenized: true              # rows carry input_ids + loss_mask (our Aurora fork accepts loss_mask when there are no labels)
  num_proc: 4

training:
  attention_backend: flex_attention
  micro_batch_size: 4
  draft_accumulation_steps: 4     # global batch 8 -> 32 samples per optimizer step (the first run's gradient noise took the draft from 2.95 to 2.5 accept length)
  learning_rate: 1e-5             # 1e-4 (Aurora's usual example value) degraded our converged checkpoint; 1e-5 is what Aurora's own qwen3-8b-external-with-draft example uses
  max_concurrent_batches: 1
  max_grad_norm: 2.5
  max_seq_length: 8320            # prompt (<= 4096 tokens, filtered when the prompts were built) + completion (<= 4096 new tokens) = at most 8,191 captured tokens, plus slack
  num_epochs: 1
  num_train_steps: 20             # run.sh / override; the step count does not come from the dataset size here
  seed: 42
  training_num_gpus_per_node: 2
  training_num_nodes: 1
  ttt_length: 5                   # unused by DSpark
  warmup_ratio: 0.0003            # x lr_total_steps (100000) = 30 optimizer steps of linear warmup (the Datakit run used 300 of its ~7,300; this run has only ~550 steps of 32 samples)
  lr_total_steps: 100000
  lr_decay_style: constant
  train_with_decode: true

inference:
  inference_engine_type: sgl      # unused: inference_num_gpus 0 means no local engines
  inference_num_gpus: 0
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 1
  max_sample_pool_size: 1000
  inference_buffer_threshold: 32
  inference_batch_size: 12

decode:
  max_new_tokens: 4096
  temperature: 1.0
  speculative_algorithm: DSPARK
  speculative_draft_model_path: null   # null: the trainer saves a scratch draft to <output_dir>/scratch_draft_model and the server starts from it
  speculative_num_steps: 5
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 6
  weight_sync_enabled: true
  weight_sync_interval: 5              # smoke test; 50 for real runs

online_serving:
  enabled: true
  host: "0.0.0.0"
  port: 18080
  sglang_url: null                     # run.sh: the capture server's URL (Aurora's key name, from its SGLang days)

mooncake:
  master_server_address: null          # run.sh
  metadata_server: null
  protocol: tcp
  global_segment_size: 8GB
  local_buffer_size: 16GB              # a sample is up to 8.3k tokens x about 20 KB = 170 MB; the trainer fetches micro_batch_size x prefetch of them
  hidden_dim: 2560                     # the TARGET's hidden size (Aurora sizes buffers as 3 tapped layers + the final states from it; its default is 4096)
  max_seq_len: 8320

output_dir: ""                         # run.sh
cache_dir: ./cache
model_download_dir: null

logging:
  report_to: none

debug:
  save_debug_train_data: null
  debug_train_only: false
  debug_inference_only: false
